# EmergencyPlus — run with:  docker compose up -d --build
# Works out of the box on one computer / clinic network (http). Every value below can be
# overridden from a .env file next to this file (see .env.production.example).
name: emergencyplus

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eplus
      POSTGRES_USER: eplus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eplus-local-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eplus -d eplus"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eplus:${DB_PASSWORD:-eplus-local-db}@db:5432/eplus?schema=public
      # Leave empty to auto-generate one (stored in the data volume).
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 4000
      APP_PORT: ${APP_PORT:-4080}
      TZ: ${TZ:-Asia/Amman}
      UPLOAD_DIR: /data/uploads
      # Set to true only when the app is served over HTTPS (reverse proxy with a certificate).
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      # The first admin must replace the initial password at first sign-in.
      ADMIN_FORCE_CHANGE: ${ADMIN_FORCE_CHANGE:-true}
      DEMO_DATA: ${DEMO_DATA:-false}
    volumes:
      - appdata:/data
    ports:
      - "${APP_PORT:-4080}:4000"

volumes:
  pgdata:
  appdata:
